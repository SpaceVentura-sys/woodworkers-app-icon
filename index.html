<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Van Inventory Hub</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="apple-touch-icon"
        sizes="180x180"
        href="icon.png">

  <link rel="manifest"
        href="manifest.webmanifest">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Van Inventory">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .content {
      max-width: 420px;
    }

    img {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0;
      font-size: 17px;
      line-height: 1.5;
      opacity: 0.85;
    }
  </style>

  <script>
    setTimeout(function () {
      window.location.href =
        "https://script.google.com/a/macros/woodworkersacademy.com/s/AKfycbwyxPKzf7fHl8TL1EJZrrRQHWUjLXWRBwPJhdI4CoVFTq8d8hq-jghdsHccqBb7rrgP/exec";
    }, 15000);
  </script>
</head>

<body>
  <div class="content">
    <img src="icon.png" alt="Van Inventory">

    <h1>Van Inventory Hub</h1>

    <p>
      On iPhone, tap Share and choose “Add to Home Screen.”
      The inventory app will open automatically in a few seconds.
    </p>
  </div>
</body>
</html>
